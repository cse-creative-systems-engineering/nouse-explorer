<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nouse Explorer — Showpiece</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a;
  --text:rgba(255,255,255,.95); --text2:rgba(255,255,255,.62); --text3:rgba(255,255,255,.36);
  --gold:#f5a623; --gold-bright:#ffc95c; --gold-glow:rgba(245,166,35,.45);
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --success:#34d399; --info:#60a5fa;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* ═══════════ LIVING BACKGROUND ═══════════ */
#field{position:fixed;inset:0;z-index:0}
.aurora{position:fixed;border-radius:50%;filter:blur(140px);opacity:.5;pointer-events:none;z-index:0;mix-blend-mode:screen}
.au1{width:900px;height:600px;background:radial-gradient(ellipse,rgba(245,166,35,.14),transparent 65%);top:-250px;left:-150px;animation:aur1 26s ease-in-out infinite alternate}
.au2{width:800px;height:700px;background:radial-gradient(ellipse,rgba(96,80,255,.12),transparent 65%);bottom:-300px;right:-200px;animation:aur2 32s ease-in-out infinite alternate}
.au3{width:500px;height:500px;background:radial-gradient(ellipse,rgba(52,211,153,.06),transparent 60%);top:40%;left:55%;animation:aur1 38s ease-in-out infinite alternate-reverse}
@keyframes aur1{from{transform:translate(0,0) scale(1)}to{transform:translate(140px,60px) scale(1.15)}}
@keyframes aur2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-120px,-50px) scale(.92)}}

/* ═══════════ APP SHELL ═══════════ */
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}

/* glass titlebar with chromatic edge */
.titlebar{display:flex;align-items:center;height:46px;padding:0 10px 0 16px;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border-bottom:1px solid var(--border);backdrop-filter:blur(30px);position:relative}
.titlebar::after{content:'';position:absolute;bottom:-1px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(245,166,35,.5),transparent)}
.brandmark{display:flex;align-items:center;gap:11px}
.mark{width:26px;height:26px;border-radius:8px;position:relative;
  background:conic-gradient(from 210deg,#f5a623,#ff7b3d,#f5a62355,#f5a623);
  box-shadow:0 0 22px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.4);
  animation:markpulse 4s ease-in-out infinite}
.mark::after{content:'N';position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0a0a0f}
@keyframes markpulse{0%,100%{box-shadow:0 0 22px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 40px rgba(245,166,35,.7),inset 0 1px 0 rgba(255,255,255,.4)}}
.bname{font-size:14px;font-weight:700;letter-spacing:-.2px}
.bsub{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.tb-spacer{flex:1}
.tbtn{width:38px;height:34px;display:grid;place-items:center;color:var(--text3);background:none;border:none;cursor:pointer;border-radius:8px;transition:all .18s}
.tbtn:hover{background:var(--glass2);color:var(--text)}
.tbtn.close:hover{background:#e81123;color:#fff}

/* ═══════════ HERO STRIP: animated counters ═══════════ */
.hero{display:flex;align-items:center;gap:36px;padding:20px 28px 16px;flex:none}
.htitle{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.htitle em{font-style:normal;color:var(--gold);text-shadow:0 0 30px var(--gold-glow)}
.hsub{font-size:11.5px;color:var(--text3);margin-top:3px;font-weight:400}
.hstats{display:flex;gap:28px;margin-left:auto}
.hstat{text-align:right;opacity:0;animation:rise .7s var(--ease) forwards}
.hstat:nth-child(1){animation-delay:.15s}.hstat:nth-child(2){animation-delay:.25s}.hstat:nth-child(3){animation-delay:.35s}.hstat:nth-child(4){animation-delay:.45s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hnum{font-family:'JetBrains Mono';font-size:26px;font-weight:600;letter-spacing:-1px;color:var(--text);text-shadow:0 0 24px rgba(255,255,255,.14)}
.hnum.gold{color:var(--gold);text-shadow:0 0 28px var(--gold-glow)}
.hlbl{font-size:9.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin-top:2px}

/* ═══════════ CONTROL DECK: custom controls ═══════════ */
.deck{display:flex;align-items:center;gap:14px;padding:6px 28px 16px;flex:none}

/* custom search with sweep glow */
.cmdbar{position:relative;flex:1;max-width:520px;height:46px;border-radius:14px;overflow:hidden;
  background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(20px);display:flex;align-items:center;gap:11px;padding:0 15px;
  transition:border-color .3s,box-shadow .3s}
.cmdbar::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);
  transform:translateX(-100%);animation:sweep 5.5s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-100%)}90%,100%{transform:translateX(100%)}}
.cmdbar:focus-within{border-color:rgba(245,166,35,.55);box-shadow:0 0 0 4px rgba(245,166,35,.1),0 0 34px rgba(245,166,35,.12)}
.cmdbar .ic{color:var(--text3);font-size:15px}
.cmdbar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Sora';font-weight:400}
.cmdbar input::placeholder{color:var(--text3)}
.kbd{font-family:'JetBrains Mono';font-size:10px;color:var(--text2);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--border);border-radius:6px;padding:3px 7px;box-shadow:0 2px 0 rgba(0,0,0,.4)}

/* custom use-case selector — morphing pill slider */
.ucwrap{position:relative;display:flex;gap:2px;background:var(--glass);border:1px solid var(--border);border-radius:13px;padding:4px;backdrop-filter:blur(20px)}
.ucslide{position:absolute;top:4px;bottom:4px;border-radius:10px;background:linear-gradient(135deg,rgba(245,166,35,.22),rgba(245,166,35,.08));
  border:1px solid rgba(245,166,35,.4);box-shadow:0 0 20px rgba(245,166,35,.15);transition:left .35s var(--ease),width .35s var(--ease);z-index:0}
.uc{position:relative;z-index:1;border:none;background:none;color:var(--text2);font-family:'Sora';font-size:12px;font-weight:600;padding:8px 13px;cursor:pointer;border-radius:10px;transition:color .25s;letter-spacing:.1px}
.uc.active{color:var(--gold-bright)}
.uc:not(.active):hover{color:var(--text)}

/* custom glass toggle */
.tgwrap{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.4px}
.toggle{width:42px;height:23px;border-radius:999px;background:var(--glass2);border:1px solid var(--border);position:relative;cursor:pointer;transition:all .3s var(--ease);flex:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.75);transition:all .3s var(--ease)}
.toggle.on{background:linear-gradient(135deg,rgba(245,166,35,.35),rgba(245,166,35,.15));border-color:rgba(245,166,35,.5);box-shadow:0 0 18px rgba(245,166,35,.2)}
.toggle.on::after{left:21px;background:var(--gold-bright);box-shadow:0 0 12px var(--gold-glow)}

/* view toggle */
.vt{display:flex;gap:2px;background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:3px}
.vt button{border:none;background:none;color:var(--text3);font-family:'Sora';font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;transition:all .25s}
.vt button.on{background:var(--glass2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* ═══════════ RESULTS: 3D tilt cards with light sweep ═══════════ */
.results{flex:1;overflow-y:auto;padding:4px 28px 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:15px;align-content:start}
.card{position:relative;border-radius:18px;padding:18px;cursor:pointer;opacity:0;transform:translateY(24px) scale(.96);
  background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.02) 55%);
  border:1px solid var(--border);backdrop-filter:blur(24px);
  transition:border-color .3s,box-shadow .3s;
  animation:cardin .65s var(--ease) forwards;animation-delay:calc(var(--i)*.045s);
  transform-style:preserve-3d;will-change:transform}
@keyframes cardin{to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
  background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 38%,transparent 65%,rgba(245,166,35,.12));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .35s;pointer-events:none}
.card::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);
  transform:skewX(-18deg);transition:left .55s var(--ease);pointer-events:none}
.card:hover{border-color:rgba(245,166,35,.35);box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 44px rgba(245,166,35,.09),inset 0 1px 0 rgba(255,255,255,.08)}
.card:hover::before{opacity:1}
.card:hover::after{left:130%}

.card-top{display:flex;align-items:center;gap:12px}
.ava{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;
  background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--border);color:var(--text);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .3s var(--ease)}
.card:hover .ava{transform:scale(1.08) rotate(-4deg)}
.cmeta{min-width:0}
.cname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprov{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:2px}
.disc-badge{margin-left:auto;font-family:'JetBrains Mono';font-size:12px;font-weight:600;color:var(--gold-bright);
  background:linear-gradient(135deg,rgba(245,166,35,.2),rgba(245,166,35,.07));border:1px solid rgba(245,166,35,.4);border-radius:999px;padding:4px 11px;
  box-shadow:0 0 18px rgba(245,166,35,.14);animation:discpulse 2.6s ease-in-out infinite}
@keyframes discpulse{0%,100%{box-shadow:0 0 12px rgba(245,166,35,.1)}50%{box-shadow:0 0 26px rgba(245,166,35,.28)}}

.prices{display:flex;gap:22px;margin-top:15px}
.pr .l{font-size:8.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.pr .v{font-family:'JetBrains Mono';font-size:16px;font-weight:600;margin-top:3px;letter-spacing:-.3px;color:var(--text)}
.pr .v.free{color:var(--success);text-shadow:0 0 16px rgba(52,211,153,.35)}

/* benchmark rings */
.rings{display:flex;gap:14px;margin-top:15px;align-items:center}
.ring{position:relative;width:46px;height:46px}
.ring svg{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:3.5}
.ring .fillc{fill:none;stroke:url(#goldgrad);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:126;stroke-dashoffset:126;
  animation:ringfill 1.3s var(--ease) forwards;animation-delay:calc(.5s + var(--i)*.05s)}
@keyframes ringfill{to{stroke-dashoffset:var(--off)}}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-family:'JetBrains Mono';font-size:10.5px;font-weight:600}
.rlbl{text-align:center;font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:4px}
.nobench{font-size:10.5px;color:var(--text3);border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:9px 13px;font-weight:500}

.cfoot{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05)}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.4px;color:var(--text2);background:var(--glass2);border-radius:7px;padding:3px 8px}
.tag.blue{color:var(--info);background:rgba(96,165,250,.12)}
.tag.gold{color:var(--gold-bright);background:rgba(245,166,35,.1)}
.ctxr{margin-left:auto;font-family:'JetBrains Mono';font-size:10.5px;color:var(--text3)}

/* scrollbar */
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:rgba(245,166,35,.3)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}.ring .fillc{stroke-dashoffset:var(--off)}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="aurora au1"></div><div class="aurora au2"></div><div class="aurora au3"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#f5a623"/><stop offset="100%" stop-color="#ffcf6b"/>
</linearGradient></defs></svg>

<div class="app">
  <div class="titlebar">
    <div class="brandmark"><div class="mark"></div><div><div class="bname">Nouse Explorer</div><div class="bsub">Model Intelligence</div></div></div>
    <span class="tb-spacer"></span>
    <button class="tbtn">–</button><button class="tbtn">▢</button><button class="tbtn close">✕</button>
  </div>

  <div class="hero">
    <div>
      <div class="htitle">Every model. Live prices.<br><em>Zero surprises.</em></div>
      <div class="hsub">The complete Nous Portal catalog — ranked, priced, benchmarked</div>
    </div>
    <div class="hstats">
      <div class="hstat"><div class="hnum" data-n="377">0</div><div class="hlbl">Models</div></div>
      <div class="hstat"><div class="hnum" data-n="366">0</div><div class="hlbl">Discounted</div></div>
      <div class="hstat"><div class="hnum gold" data-n="208">0</div><div class="hlbl">Benchmarked</div></div>
      <div class="hstat"><div class="hnum" data-n="6">0</div><div class="hlbl">Free</div></div>
    </div>
  </div>

  <div class="deck">
    <div class="cmdbar">
      <span class="ic">⌕</span>
      <input id="q" placeholder="Search 377 models — name, provider, capability…">
      <span class="kbd">⌘K</span>
    </div>
    <div class="ucwrap" id="ucwrap">
      <div class="ucslide" id="ucslide"></div>
      <button class="uc active" data-u="all">✦ All</button>
      <button class="uc" data-u="coding">⌘ Coding</button>
      <button class="uc" data-u="research">◉ Research</button>
      <button class="uc" data-u="free">◇ Free</button>
      <button class="uc" data-u="vision">◑ Vision</button>
    </div>
    <div class="tgwrap"><span>AUTO-REFRESH</span><div class="toggle on" id="tg"></div></div>
    <div class="vt"><button class="on">Cards</button><button>Table</button></div>
  </div>

  <div class="results"><div class="grid" id="grid"></div></div>
</div>

<script>
/* ═══ particle field ═══ */
const cv=document.getElementById('field'),cx=cv.getContext('2d');let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.4+.3,g:Math.random()>.82});
(function tick(){
  cx.clearRect(0,0,W,H);
  for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=p.g?'rgba(245,166,35,.5)':'rgba(255,255,255,.22)';cx.fill()}
  requestAnimationFrame(tick)})();

/* ═══ animated counters ═══ */
document.querySelectorAll('.hnum').forEach(el=>{
  const target=+el.dataset.n,t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);if(p<1)requestAnimationFrame(step)})(t0)});

/* ═══ use-case sliding pill ═══ */
const ucwrap=document.getElementById('ucwrap'),slide=document.getElementById('ucslide');
function moveSlide(btn){slide.style.left=btn.offsetLeft+'px';slide.style.width=btn.offsetWidth+'px'}
const ucBtns=[...document.querySelectorAll('.uc')];
requestAnimationFrame(()=>moveSlide(ucBtns[0]));
ucBtns.forEach(b=>b.addEventListener('click',()=>{ucBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');moveSlide(b);apply()}));
addEventListener('resize',()=>moveSlide(ucwrap.querySelector('.active')));

/* ═══ glass toggle ═══ */
document.getElementById('tg').addEventListener('click',function(){this.classList.toggle('on')});

/* ═══ 3D tilt + light tracking ═══ */
addEventListener('mousemove',e=>{
  document.querySelectorAll('.card:hover').forEach(c=>{
    const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`perspective(900px) rotateY(${x*7}deg) rotateX(${-y*7}deg) translateY(-3px)`});
  document.querySelectorAll('.card:not(:hover)').forEach(c=>c.style.transform='');
});

        <div class="ava">${prov[0].toUpperCase()}</div>
        <div class="cmeta"><div class="cname">${name}</div><div class="cprov">${prov}</div></div>
        ${disc>0?`<span class="disc-badge">−${disc}%</span>`:''}
      </div>
      <div class="prices">
        <div class="pr"><div class="l">In / 1M</div><div class="v ${inp===0?'free':''}">${inp===0?'FREE':'$'+fmt(inp)}</div></div>
        <div class="pr"><div class="l">Out / 1M</div><div class="v ${out===0?'free':''}">${out===0?'FREE':'$'+fmt(out)}</div></div>
      </div>
      <div class="rings">
        ${ring('Coding',ci,100)}${ring('Intel',ii,100)}${ring('Elo',elo,1400)}
        ${(ci==null&&ii==null&&elo==null)?'<div class="nobench">No benchmark data yet — fetchable</div>':''}
      </div>
      <div class="cfoot">
        <span class="tag">${fmtc(ctx)} ctx</span>
        ${vision?'<span class="tag blue">VISION</span>':''}
        ${inp===0?'<span class="tag gold">FREE</span>':''}
      </div>
    </div>`}).join('');
}
function apply(){
  const u=ucwrap.querySelector('.active').dataset.u,q=document.getElementById('q').value.toLowerCase();
  let list=MODELS;
  if(u==='coding')list=list.filter(m=>m[6]!=null).sort((a,b)=>b[6]-a[6]);
  if(u==='research')list=list.filter(m=>m[7]!=null).sort((a,b)=>b[7]-a[7]);
  if(u==='free')list=list.filter(m=>m[3]===0);
  if(u==='vision')list=list.filter(m=>m[9]===1);
  if(q)list=list.filter(m=>m[0].toLowerCase().includes(q)||m[1].toLowerCase().includes(q));
  render(list);
}
document.getElementById('q').addEventListener('input',apply);
apply();
</script>
</body>
</html>
