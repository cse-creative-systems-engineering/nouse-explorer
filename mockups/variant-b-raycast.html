<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nouse Explorer — Variant B (Raycast glass)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a; --surface:#101111; --surface2:#1b1c1e;
  --text:#f9f9f9; --text2:#cecece; --text3:#9c9c9d; --text4:#6a6b6c;
  --accent:#ffbc33; --accent-glow:rgba(255,188,51,.25);
  --blue:#55b3ff; --green:#5fc992;
  --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;letter-spacing:.2px;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.2px}

/* ambient glow blobs */
.glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.glow.g1{width:600px;height:600px;background:rgba(255,188,51,.05);top:-200px;right:-100px}
.glow.g2{width:500px;height:500px;background:rgba(85,179,255,.04);bottom:-150px;left:-150px}

.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
.titlebar{display:flex;align-items:center;height:44px;padding:0 8px 0 16px;flex:none}
.dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--accent),#ff8c33);box-shadow:0 0 14px var(--accent-glow)}
.brand{margin-left:9px;font-size:13.5px;font-weight:600}
.tb-spacer{flex:1}
.tb-btn{width:42px;height:44px;display:grid;place-items:center;color:var(--text4);background:none;border:none;cursor:pointer;border-radius:8px}
.tb-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}

/* hero command row */
.hero{padding:28px 32px 20px;flex:none}
.hero h1{font-size:26px;font-weight:600;letter-spacing:-.3px}
.hero h1 span{color:var(--accent);text-shadow:0 0 24px var(--accent-glow)}
.hero p{margin-top:5px;font-size:13px;color:var(--text3);font-weight:400}

/* big search — raycast command bar */
.cmdbar{margin:0 32px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:13px 16px;
  box-shadow:rgba(0,0,0,.5) 0 0 0 1px inset, rgba(255,255,255,.05) 0 1px 0 0 inset, rgba(0,0,0,.4) 0 12px 32px}
.cmdbar:focus-within{border-color:rgba(255,188,51,.4);box-shadow:0 0 0 3px rgba(255,188,51,.08), rgba(255,255,255,.05) 0 1px 0 0 inset}
.cmdbar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit;letter-spacing:.2px}
.cmdbar .icon{color:var(--text4);font-size:16px}
.kbd{font-family:'Geist Mono';font-size:11px;color:var(--text3);background:linear-gradient(180deg,#121212,#0d0d0d);border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:2px 7px;box-shadow:rgba(0,0,0,.4) 0 1.5px 0.5px}

/* preset chips */
.chips{display:flex;gap:8px;padding:16px 32px 4px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--text2);background:rgba(255,255,255,.02);cursor:pointer;transition:all .18s;font-family:inherit}
.chip:hover{border-color:rgba(255,255,255,.18);color:var(--text)}
.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(255,188,51,.07);box-shadow:0 0 18px rgba(255,188,51,.12)}
.chip .em{font-size:13px}

/* results: glass cards grid */
.results{flex:1;overflow:auto;padding:16px 32px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-content:start}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:14px;padding:16px 16px 13px;cursor:pointer;transition:all .2s cubic-bezier(.2,.7,.3,1);position:relative}
.card:hover{border-color:rgba(255,188,51,.35);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.45), 0 0 22px rgba(255,188,51,.06)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:600;flex:none;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--text2)}
.cname{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.3}
.cid{font-size:11px;color:var(--text4);font-family:'Geist Mono';margin-top:2px}
.disc-badge{margin-left:auto;font-family:'Geist Mono';font-size:11.5px;font-weight:500;color:var(--accent);background:rgba(255,188,51,.09);border:1px solid rgba(255,188,51,.25);border-radius:999px;padding:3px 9px;box-shadow:0 0 14px rgba(255,188,51,.08)}
.price-row{display:flex;gap:18px;margin-top:12px}
.price .lbl{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text4)}
.price .val{font-family:'Geist Mono';font-size:14.5px;color:var(--text);margin-top:3px}
.price .val.free{color:var(--green)}
.meta-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:500;color:var(--text3);background:var(--surface2);border-radius:6px;padding:3px 8px}
.tag.acc{color:var(--accent);background:rgba(255,188,51,.08)}
.tag.blue{color:var(--blue);background:rgba(85,179,255,.08)}
.tag.none{color:var(--text4);border:1px dashed rgba(255,255,255,.14);background:none}

.footer{display:flex;align-items:center;padding:10px 32px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text4);flex:none}
</style>
</head>

const fmt=n=>n>=100?n.toFixed(0):n>=1?n.toFixed(2):n===0?'0':n.toFixed(4);
const fmtc=n=>n>=1e6?(n/1e6)+'M':n>=1e3?Math.round(n/1e3)+'K':n;
const grid=document.getElementById('grid');
function render(list){
  grid.innerHTML=list.slice(0,120).map(m=>{
    const [id,name,ctx,inp,out,disc,ci,ii,elo,vision]=m;
    const prov=id.split('/')[0];
    const ciTag=ci!=null?`<span class="tag acc" title="coding index">⌘ ${ci.toFixed?ci.toFixed(1):ci}</span>`:`<span class="tag none">no coding score</span>`;
    const vTag=vision?`<span class="tag blue">vision</span>`:'';
    return `<div class="card">
      <div class="card-top">
        <div class="avatar">${prov[0].toUpperCase()}</div>
        <div><div class="cname">${name}</div><div class="cid">${id}</div></div>
        ${disc>0?`<span class="disc-badge">−${disc}%</span>`:''}
      </div>
      <div class="price-row">
        <div class="price"><div class="lbl">In / 1M</div><div class="val ${inp===0?'free':''}">${inp===0?'Free':'$'+fmt(inp)}</div></div>
        <div class="price"><div class="lbl">Out / 1M</div><div class="val ${out===0?'free':''}">${out===0?'Free':'$'+fmt(out)}</div></div>
        <div class="price"><div class="lbl">Context</div><div class="val">${fmtc(ctx)}</div></div>
      </div>
      <div class="meta-row">${ciTag}${vTag}</div>
    </div>`}).join('');
}
render(MODELS.sort((a,b)=>(b[6]??-1)-(a[6]??-1)));
document.getElementById('q').addEventListener('input',e=>{
  const v=e.target.value.toLowerCase();
  render(MODELS.filter(m=>m[0].toLowerCase().includes(v)||m[1].toLowerCase().includes(v)));
});
